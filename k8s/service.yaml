apiVersion: v1
kind: Service
metadata:
  name: iam-analyzer
  labels:
    app: iam-analyzer
spec:
  # LoadBalancer is published on http://localhost by Docker Desktop's Kubernetes and gets a
  # public IP on cloud clusters. Docker Desktop does not publish plain NodePorts to the host;
  # use `type: NodePort` only with minikube (`minikube service iam-analyzer`) or similar.
  type: LoadBalancer
  selector:
    app: iam-analyzer
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30501
